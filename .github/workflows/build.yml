name: Build SomnoPulse Galaxy Watch Ultra APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build SomnoPulse Standalone APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Assemble Wear OS Project Structure
      run: |
        mkdir -p app/src/main/java/com/somnopulse/watch
        mkdir -p app/src/main/res/values

        cat << 'PROPS' > gradle.properties
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        org.gradle.jvmargs=-Xmx2048m
        PROPS

        cat << 'GRADLE_SETTINGS' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "SomnoPulse-GalaxyWatch"
        include(":app")
        GRADLE_SETTINGS

        cat << 'ROOT_GRADLE' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.0" apply false
            id("org.jetbrains.kotlin.android") version "1.9.20" apply false
        }
        ROOT_GRADLE

        cat << 'APP_GRADLE' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }
        android {
            namespace = "com.somnopulse.watch"
            compileSdk = 34
            defaultConfig {
                applicationId = "com.somnopulse.watch"
                minSdk = 28
                targetSdk = 34
                versionCode = 4
                versionName = "4.0"
            }
            buildTypes {
                release {
                    isMinifyEnabled = false
                }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_1_8
                targetCompatibility = JavaVersion.VERSION_1_8
            }
            kotlinOptions {
                jvmTarget = "1.8"
            }
        }
        dependencies {
            implementation("androidx.core:core:1.12.0")
        }
        APP_GRADLE

        cat << 'MANIFEST' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.somnopulse.watch">
            <uses-feature android:name="android.hardware.type.watch" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.VIBRATE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <application
                android:allowBackup="true"
                android:icon="@android:drawable/ic_lock_idle_alarm"
                android:label="SomnoPulse Ultra"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.DeviceDefault">
                <service
                    android:name=".SnoreDetectorService"
                    android:enabled="true"
                    android:exported="false"
                    android:foregroundServiceType="microphone" />
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:label="SomnoPulse Ultra"
                    android:theme="@android:style/Theme.DeviceDefault">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                    <intent-filter>
                        <action android:name="com.samsung.android.hardware.action.QUICK_BUTTON" />
                        <category android:name="android.intent.category.DEFAULT" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        MANIFEST

        cat << 'MAIN_KT' > app/src/main/java/com/somnopulse/watch/MainActivity.kt
        package com.somnopulse.watch
        import android.Manifest
        import android.app.Activity
        import android.content.Context
        import android.content.Intent
        import android.content.pm.PackageManager
        import android.graphics.Color
        import android.os.Bundle
        import android.view.Gravity
        import android.widget.Button
        import android.widget.LinearLayout
        import android.widget.ScrollView
        import android.widget.TextView
        import androidx.core.app.ActivityCompat
        import androidx.core.content.ContextCompat

        class MainActivity : Activity() {
            private lateinit var statusText: TextView
            private lateinit var baselineText: TextView
            private lateinit var toggleButton: Button
            private lateinit var marginButton: Button
            private lateinit var testPulseButton: Button
            private var isMonitoring = false
            private var testLevel = 1

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val prefs = getSharedPreferences("somno_prefs", Context.MODE_PRIVATE)

                val scrollView = ScrollView(this).apply {
                    setBackgroundColor(Color.BLACK)
                }

                val layout = LinearLayout(this).apply {
                    orientation = LinearLayout.VERTICAL
                    gravity = Gravity.CENTER_HORIZONTAL
                    setPadding(24, 24, 24, 48)
                }

                statusText = TextView(this).apply {
                    text = "SomnoPulse Ultra v4"
                    setTextColor(Color.WHITE)
                    textSize = 14f
                    gravity = Gravity.CENTER
                    setPadding(0, 0, 0, 4)
                }

                baselineText = TextView(this).apply {
                    val savedBase = prefs.getFloat("ambient_baseline_db", 0f)
                    text = if (savedBase > 0) "Room Baseline: ${savedBase.toInt()} dB" else "Auto-Calibrating Room Noise..."
                    setTextColor(Color.parseColor("#38BDF8"))
                    textSize = 11f
                    gravity = Gravity.CENTER
                    setPadding(0, 0, 0, 10)
                }

                toggleButton = Button(this).apply {
                    text = "Start Sleep Guard"
                    setBackgroundColor(Color.parseColor("#1E3A8A"))
                    setTextColor(Color.WHITE)
                    setOnClickListener {
                        if (isMonitoring) stopService() else checkPermissionsAndStart()
                    }
                }

                var currentMargin = prefs.getInt("snore_margin_db", 10)
                marginButton = Button(this).apply {
                    val label = when(currentMargin) {
                        8 -> "Trigger: Baseline +8dB (Sensitive)"
                        14 -> "Trigger: Baseline +14dB (Loud Only)"
                        else -> "Trigger: Baseline +10dB (Normal)"
                    }
                    text = label
                    setBackgroundColor(Color.parseColor("#1F2937"))
                    setTextColor(Color.parseColor("#FBBF24"))
                    setOnClickListener {
                        currentMargin = when(currentMargin) {
                            8 -> 10
                            10 -> 14
                            else -> 8
                        }
                        val newLabel = when(currentMargin) {
                            8 -> "Trigger: Baseline +8dB (Sensitive)"
                            14 -> "Trigger: Baseline +14dB (Loud Only)"
                            else -> "Trigger: Baseline +10dB (Normal)"
                        }
                        text = newLabel
                        prefs.edit().putInt("snore_margin_db", currentMargin).apply()
                    }
                }

                testPulseButton = Button(this).apply {
                    text = "Test Pulse (Lvl 1: Soft Tap)"
                    setBackgroundColor(Color.parseColor("#374151"))
                    setTextColor(Color.WHITE)
                    setOnClickListener {
                        GalaxyWatchUltraHelper.performUltraHapticPulse(this@MainActivity, testLevel)
                        testLevel = if (testLevel >= 4) 1 else testLevel + 1
                        val nextDesc = when(testLevel) {
                            1 -> "Lvl 1: Soft Tap"
                            2 -> "Lvl 2: Dual Nudge"
                            3 -> "Lvl 3: Heavy Buzz"
                            else -> "Lvl 4: Wake Alert"
                        }
                        text = "Test Pulse ($nextDesc)"
                    }
                }

                layout.addView(statusText)
                layout.addView(baselineText)
                layout.addView(toggleButton)
                layout.addView(marginButton)
                layout.addView(testPulseButton)

                scrollView.addView(layout)
                setContentView(scrollView)
            }

            private fun checkPermissionsAndStart() {
                if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                    ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.RECORD_AUDIO), 101)
                } else {
                    startService()
                }
            }

            private fun startService() {
                val intent = Intent(this, SnoreDetectorService::class.java)
                ContextCompat.startForegroundService(this, intent)
                isMonitoring = true
                statusText.text = "Guard Active (Listening)"
                statusText.setTextColor(Color.parseColor("#38BDF8"))
                toggleButton.text = "Stop Sleep Guard"
                toggleButton.setBackgroundColor(Color.parseColor("#991B1B"))
            }

            private fun stopService() {
                val intent = Intent(this, SnoreDetectorService::class.java)
                stopService(intent)
                isMonitoring = false
                statusText.text = "Guard Stopped"
                statusText.setTextColor(Color.WHITE)
                toggleButton.text = "Start Sleep Guard"
                toggleButton.setBackgroundColor(Color.parseColor("#1E3A8A"))
            }
        }
        MAIN_KT

        cat << 'HELPER_KT' > app/src/main/java/com/somnopulse/watch/GalaxyWatchUltraHelper.kt
        package com.somnopulse.watch
        import android.content.Context
        import android.os.Build
        import android.os.VibrationEffect
        import android.os.Vibrator
        import android.os.VibratorManager

        object GalaxyWatchUltraHelper {
            fun performUltraHapticPulse(context: Context, escalationLevel: Int = 1) {
                val vibrator = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                    val vm = context.getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager
                    vm.defaultVibrator
                } else {
                    @Suppress("DEPRECATION")
                    context.getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                }

                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    val effect = when (escalationLevel) {
                        1 -> VibrationEffect.createOneShot(120, 110)
                        2 -> {
                            val timings = longArrayOf(0, 240, 120, 240)
                            val amplitudes = intArrayOf(0, 180, 0, 210)
                            VibrationEffect.createWaveform(timings, amplitudes, -1)
                        }
                        3 -> {
                            val timings = longArrayOf(0, 320, 90, 320, 90, 380)
                            val amplitudes = intArrayOf(0, 220, 0, 240, 0, 255)
                            VibrationEffect.createWaveform(timings, amplitudes, -1)
                        }
                        else -> {
                            val timings = longArrayOf(0, 400, 80, 400, 80, 400, 80, 450, 80, 500)
                            val amplitudes = intArrayOf(0, 255, 0, 255, 0, 255, 0, 255, 0, 255)
                            VibrationEffect.createWaveform(timings, amplitudes, -1)
                        }
                    }
                    vibrator.vibrate(effect)
                } else {
                    @Suppress("DEPRECATION")
                    val pattern = when(escalationLevel) {
                        1 -> longArrayOf(0, 120)
                        2 -> longArrayOf(0, 240, 120, 240)
                        3 -> longArrayOf(0, 320, 90, 320, 90, 380)
                        else -> longArrayOf(0, 400, 80, 400, 80, 400)
                    }
                    vibrator.vibrate(pattern, -1)
                }
            }
        }
        HELPER_KT

        cat << 'SERVICE_KT' > app/src/main/java/com/somnopulse/watch/SnoreDetectorService.kt
        package com.somnopulse.watch
        import android.app.*
        import android.content.Context
        import android.content.Intent
        import android.media.AudioFormat
        import android.media.AudioRecord
        import android.media.MediaRecorder
        import android.os.*
        import androidx.core.app.NotificationCompat
        import java.util.*
        import kotlin.math.log10
        import kotlin.math.max
        import kotlin.math.min
        import kotlin.math.sqrt

        class SnoreDetectorService : Service() {
            private var isRunning = false
            private var audioRecord: AudioRecord? = null
            private var wakeLock: PowerManager.WakeLock? = null
            private val sleepStartHour = 22
            private val sleepEndHour = 7

            private var escalationLevel = 1
            private var lastPulseTimestamp: Long = 0
            private val gracePeriodMs: Long = 20_000
            private var quietStartTime: Long = 0

            private var baselineDb = 0.0
            private var isCalibrated = false
            private val calibrationDurationMs = 15_000L
            private var calibrationStartTime = 0L
            private var calibrationSamples = 0
            private var calibrationSum = 0.0

            private var consecutiveSnoreFrames = 0
            private val requiredSnoreFrames = 6

            override fun onCreate() {
                super.onCreate()
                val powerManager = getSystemService(Context.POWER_SERVICE) as PowerManager
                wakeLock = powerManager.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "SomnoPulse::SleepWakeLock")
                wakeLock?.acquire(10 * 60 * 60 * 1000L)
                startForeground(4040, createForegroundNotification("Calibrating room background noise..."))
            }

            override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                if (!isRunning) {
                    isRunning = true
                    escalationLevel = 1
                    isCalibrated = false
                    calibrationSamples = 0
                    calibrationSum = 0.0
                    calibrationStartTime = System.currentTimeMillis()
                    startAcousticSnoreDetection()
                }
                return START_STICKY
            }

            private fun isWithinSleepHours(): Boolean {
                val calendar = Calendar.getInstance()
                val hour = calendar.get(Calendar.HOUR_OF_DAY)
                return if (sleepStartHour > sleepEndHour) {
                    hour >= sleepStartHour || hour < sleepEndHour
                } else {
                    hour in sleepStartHour until sleepEndHour
                }
            }

            private fun startAcousticSnoreDetection() {
                val prefs = getSharedPreferences("somno_prefs", Context.MODE_PRIVATE)
                Thread {
                    val sampleRate = 16000
                    val bufferSize = AudioRecord.getMinBufferSize(sampleRate, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT)
                    try {
                        audioRecord = AudioRecord(MediaRecorder.AudioSource.MIC, sampleRate, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, bufferSize)
                        audioRecord?.startRecording()
                        val audioBuffer = ShortArray(bufferSize)

                        while (isRunning) {
                            val readSize = audioRecord?.read(audioBuffer, 0, bufferSize) ?: 0
                            if (readSize > 0) {
                                var sum = 0.0
                                for (i in 0 until readSize) { sum += audioBuffer[i] * audioBuffer[i] }
                                val rms = sqrt(sum / readSize)
                                val currentDb = if (rms > 0) 20 * log10(rms) else 0.0
                                val now = System.currentTimeMillis()

                                if (!isCalibrated) {
                                    calibrationSum += currentDb
                                    calibrationSamples++
                                    if (now - calibrationStartTime >= calibrationDurationMs) {
                                        baselineDb = if (calibrationSamples > 0) calibrationSum / calibrationSamples else 42.0
                                        isCalibrated = true
                                        prefs.edit().putFloat("ambient_baseline_db", baselineDb.toFloat()).apply()
                                        updateNotification("Active - Room Baseline: ${baselineDb.toInt()} dB")
                                    }
                                    Thread.sleep(100)
                                    continue
                                }

                                val marginDb = prefs.getInt("snore_margin_db", 10).toDouble()
                                val dynamicThreshold = baselineDb + marginDb

                                if (currentDb < dynamicThreshold) {
                                    baselineDb = (baselineDb * 0.995) + (currentDb * 0.005)
                                }

                                if (currentDb >= dynamicThreshold && isWithinSleepHours()) {
                                    consecutiveSnoreFrames++
                                    quietStartTime = 0

                                    if (consecutiveSnoreFrames >= requiredSnoreFrames) {
                                        if (now - lastPulseTimestamp > gracePeriodMs) {
                                            GalaxyWatchUltraHelper.performUltraHapticPulse(this, escalationLevel)
                                            lastPulseTimestamp = now
                                            escalationLevel = min(escalationLevel + 1, 4)
                                            consecutiveSnoreFrames = 0
                                        }
                                    }
                                } else {
                                    consecutiveSnoreFrames = max(0, consecutiveSnoreFrames - 1)

                                    if (quietStartTime == 0L) {
                                        quietStartTime = now
                                    } else if (now - quietStartTime > 18_000L) {
                                        if (escalationLevel > 1) {
                                            escalationLevel = 1
                                        }
                                    }
                                }
                            }
                            Thread.sleep(100)
                        }
                    } catch (e: Exception) { e.printStackTrace() }
                }.start()
            }

            private fun createForegroundNotification(content: String): Notification {
                val channelId = "somnopulse_sleep_channel"
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    val channel = NotificationChannel(channelId, "SomnoPulse Sleep Guard", NotificationManager.IMPORTANCE_LOW)
                    val manager = getSystemService(NotificationManager::class.java)
                    manager.createNotificationChannel(channel)
                }
                return NotificationCompat.Builder(this, channelId)
                    .setContentTitle("SomnoPulse Ultra")
                    .setContentText(content)
                    .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                    .setOngoing(true)
                    .build()
            }

            private fun updateNotification(content: String) {
                val manager = getSystemService(NotificationManager::class.java)
                manager.notify(4040, createForegroundNotification(content))
            }

            override fun onDestroy() {
                isRunning = false
                audioRecord?.stop()
                audioRecord?.release()
                if (wakeLock?.isHeld == true) wakeLock?.release()
                super.onDestroy()
            }

            override fun onBind(intent: Intent?): IBinder? = null
        }
        SERVICE_KT

    - name: Compile Wear OS APK
      run: |
        gradle assembleDebug --no-daemon --stacktrace

    - name: Package & Export SomnoPulse APK
      run: |
        mkdir -p release_output
        find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} release_output/SomnoPulse-GalaxyWatchUltra.apk \;
        ls -la release_output/

    - name: Upload APK for Direct Download
      uses: actions/upload-artifact@v4
      with:
        name: SomnoPulse-GalaxyWatchUltra-APK
        path: release_output/SomnoPulse-GalaxyWatchUltra.apk
        retention-days: 30
